# Base compose file — works the same whether you're running this on your own
# machine (paired with the ngrok/cloudflared demo scripts) or on a real VPS.
#
# Quick local run:      docker compose up -d --build
# Then point ngrok/cloudflared at:  http://localhost:3000
#
# For a real deployment with a domain + automatic HTTPS, add Caddy in front —
# see docker-compose.prod.yml + Caddyfile, and DEPLOY.md for the full steps.
services:
  fix-perms:
    build: .
    user: root
    command: chown -R node:node /app/data /app/.wwebjs_auth /app/.wwebjs_cache
    volumes:
      - wa-data:/app/data
      - wa-auth:/app/.wwebjs_auth
      - wa-cache:/app/.wwebjs_cache

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wa_secure_db_pass_2026}
      POSTGRES_DB: ${DB_NAME:-whatsapp_automation}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-whatsapp_automation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      fix-perms:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # SESSION_IDLE_TIMEOUT_MS: hibernate idle Chromium sessions after this
      # many milliseconds of inactivity (no messages + no open dashboard tab).
      # Chrome is silently restarted when the user next opens the dashboard
      # or an inbound message arrives — no QR re-scan needed.
      # Default: 2 hours (7200000 ms). Reduce if RAM is constrained.
      - SESSION_IDLE_TIMEOUT_MS=7200000
      - FORCE_HTTPS=true
      # MAX_CONCURRENT_WHATSAPP_SESSIONS is intentionally NOT set here.
      # Set it in your .env file using the sizing guide in .env.example:
      #   (total_RAM_GB - 1.5) × 3   e.g. 4GB server → 7, 8GB server → 19
      # Hardcoding it here silently overrides .env, which is how a deploy
      # meant to support 15 sessions gets stuck at 5 with no obvious reason.
    ports:
      - "3000:3000"
    volumes:
      # Named volumes, NOT bind mounts — survive `docker compose down` and
      # image rebuilds. This is where the database, the session-signing
      # secret, and every tenant's saved WhatsApp login actually live.
      - wa-data:/app/data
      - wa-auth:/app/.wwebjs_auth
      - wa-cache:/app/.wwebjs_cache

volumes:
  wa-data:
  wa-auth:
  wa-cache:
  pg-data:
